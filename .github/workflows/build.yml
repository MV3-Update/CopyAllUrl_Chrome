name: Build Copy All URLs Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version (e.g., 2.11.0)'
        required: true
        default: '2.11.0'
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Make build script executable
      run: chmod +x build.sh
      
    - name: Run build script
      run: ./build.sh -v ${{ inputs.version }}
      
    - name: Upload Chrome extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: copyallurls-chrome-extension-v${{ inputs.version }}
        path: CopyAllUrls-chrome-v${{ inputs.version }}.zip
       
    - name: Generate attestation for Chrome extension
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: CopyAllUrls-chrome-v${{ inputs.version }}.zip
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.version }}
        target_commitish: ${{ github.ref_name }}
        generate_release_notes: true
        draft: true
        files: |
          CopyAllUrls-chrome-v${{ inputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}